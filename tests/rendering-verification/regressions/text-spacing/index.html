<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body>
<div class="row"><span id="normal" data-probe>A B C</span><span class="positive" id="positive" data-probe>A B C</span><span class="negative" id="negative" data-probe>A B C</span><span class="both" id="both" data-probe>A B C</span></div>
<div class="row inherited"><span id="inherited" data-probe>A B C</span><span class="small" id="small" data-probe>A B C</span><span class="reset" id="reset" data-probe>A B C</span><span class="unset" id="unset" data-probe>A B C</span></div>
<div class="row"><span class="positive" id="nbsp" data-probe>A&#160;B&#160;C</span><span class="positive" id="collapse" data-probe>A   B   C</span><span class="positive preserved" id="preserve" data-probe>A   B   C</span><span class="positive" id="fixed-space" data-probe>A&#8194;B&#8194;C</span></div>
<div class="row"><span class="tabbed" id="tab-normal" data-probe>A&#9;B</span><span class="tabbed positive" id="tab-word" data-probe>A&#9;B</span><span class="tabbed both" id="tab-both" data-probe>A&#9;B</span><span class="positive" id="no-space" data-probe>ABC</span></div>
<div class="row"><span class="wrap" id="wrap-normal" data-probe>A B C D E</span><span class="wrap positive" id="wrap-word" data-probe>A B C D E</span><span class="rtl positive" id="rtl" data-probe>A B C</span><span class="calc" id="calc" data-probe>A B C</span></div>
</body></html>
