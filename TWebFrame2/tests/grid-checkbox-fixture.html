<!doctype html>
<style>
html,body{margin:0;background:white;font:14px Arial}
.panel{width:300px;height:70px;border:1px solid #ccc;margin:20px;background:#fafafa;display:flex;align-items:center;padding:0 10px;box-sizing:border-box}
.verification{display:grid;position:relative;place-items:center}
.verification input{position:absolute;inset:0;opacity:0;z-index:9999;margin:0;width:100%;height:100%}
.box{box-sizing:border-box;grid-area:1/1;border:2px solid #4a4a4a;border-radius:3px;background:#fff;width:24px;height:24px}
.box::after{position:absolute;border-radius:5px;content:""}
.label{grid-column:2;margin-left:8px}
.narrow .verification{width:176px}
input:checked~.box{transform:rotate(0deg) scale(1);opacity:1;border-radius:5px;background-color:#fff}
input:checked~.box::after{top:0;left:5px;transform:rotate(45deg) scale(1);border:solid #c44d0e;border-width:0 4px 4px 0;border-radius:0;width:6px;height:12px}
</style>
<div class="panel"><label class="verification"><input type="checkbox"><span class="box" id="unchecked-box"></span><span class="label">Please confirm your choice</span></label></div>
<div class="panel"><label class="verification"><input type="checkbox" checked><span class="box" id="checked-box"></span><span class="label">Please confirm your choice</span></label></div>
<div class="panel narrow"><label class="verification"><input type="checkbox"><span class="box" id="narrow-box"></span><span class="label">Please confirm your choice</span></label></div>
