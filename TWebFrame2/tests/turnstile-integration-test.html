<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Turnstile official test keys: integration only</title>
<style>
body { font: 16px sans-serif; margin: 24px; }
#status { margin-top: 16px; }
</style>
<h1>Official test keys: integration only</h1>
<p>This fixture tests script loading, iframe messages and callbacks.
It does not solve or validate a production challenge.</p>
<div id="widget"></div>
<p id="status">Loading</p>
<script>
var requestedCase=new URLSearchParams(location.search).get('case');
var testCase=requestedCase==='fail'?'fail':requestedCase==='interactive'?'interactive':'pass';
function recordIntegration(state,extra) {
    var result='TEST_ONLY|'+testCase+'|'+state+'|'+extra;
    document.getElementById('status').textContent=result;
    if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(result);
}
function integrationReady() {
    recordIntegration('ready','');
    turnstile.render('#widget',{
        sitekey:testCase==='fail'?'2x00000000000000000000AB':testCase==='interactive'?'3x00000000000000000000FF':'1x00000000000000000000AA',
        retry:'never',
        callback:function(token){recordIntegration('success','dummy='+(token==='XXXX.DUMMY.TOKEN.XXXX'));},
        'error-callback':function(code){recordIntegration('error','code='+code);},
        'timeout-callback':function(){recordIntegration('timeout','');}
    });
}
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=integrationReady&amp;render=explicit" async defer></script>
</html>
